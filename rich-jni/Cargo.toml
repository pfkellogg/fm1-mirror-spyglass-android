[package]
name = "rich"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rich sounds for FM-1 Big Screen on Android: rustysynth (MIT, sinshu) playing GeneralUser GS, through JNI"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustysynth = "=1.3.8"
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
