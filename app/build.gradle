plugins {
    id "com.android.application"
}

android {
    // the Mellotron's strips are read straight from the APK (AssetManager.openFd): stored, not compressed
    androidResources { noCompress 'flac' }
    namespace "com.pfkellogg.fm1mirror"
    compileSdk 34

    defaultConfig {
        applicationId "com.pfkellogg.fm1mirror"
        minSdk 25 // Fire TV Stick 4K (Fire OS 6 = Android 7.1); newer calls are guarded by SDK_INT
        targetSdk 34
        versionCode 37
        versionName "1.6.20"
    }
    // Release builds are signed with the key named in ../keystore.properties (kept out of git;
    // the same key every time, so a new version installs over the old one).
    def keys = new Properties()
    def keysFile = rootProject.file("keystore.properties")
    if (keysFile.exists()) keysFile.withInputStream { keys.load(it) }
    signingConfigs {
        release {
            if (keys.storeFile) {
                storeFile file(keys.storeFile)
                storePassword keys.storePassword
                keyAlias keys.keyAlias
                keyPassword keys.keyPassword
            }
        }
    }
    // Two versions: "full" with the Mellotron's flute, strings and choir built in (src/full/assets/mellotron), "lite"
    // with only the piano; both can download Mellotron sounds (Sounds.java), so new ones need no app update.
    flavorDimensions "sounds"
    productFlavors {
        full { dimension "sounds" }
        lite { dimension "sounds"; versionNameSuffix "-lite" }
    }
    buildTypes {
        release {
            signingConfig keys.storeFile ? signingConfigs.release : null
        }
        // A debug build installs beside the real app; it can be played from the computer for demo videos (see Demo.java)
        debug {
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
        }
    }
    sourceSets {
        // The same firmware package the desktop app installs.
        main.assets.srcDirs += ["../firmware"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
